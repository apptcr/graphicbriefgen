<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphic Task Management Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Sarabun','Noto Sans Thai',Tahoma,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;line-height:1.5}
h1,h3,h4,p{margin:0}
button{font:inherit;cursor:pointer;border:0;background:none}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.125em;flex:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#f1f5f9}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
header{background:#3730a3;color:#fff;box-shadow:0 2px 6px #0003;position:sticky;top:0;z-index:40}
.bar{max-width:80rem;margin:0 auto;padding:.75rem 1rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem}
.brand{display:flex;align-items:center;gap:.75rem}
.brand>.i{font-size:1.5rem;color:#facc15}
.brand h1{font-size:1.125rem;font-weight:700;letter-spacing:.025em}
.brand p{font-size:.75rem;color:#c7d2fe}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.sep{height:1.25rem;width:1px;background:#4f46e5;margin:0 .25rem}
.btn{color:#fff;padding:.375rem .75rem;border-radius:.5rem;font-size:.875rem;font-weight:600;box-shadow:0 1px 3px #0004;display:inline-flex;align-items:center;gap:.5rem;transition:filter .15s}
.btn:hover{filter:brightness(.88)}
.nav{color:#c7d2fe;font-size:.875rem;font-weight:600;text-decoration:none}.nav:hover{color:#fff}
.b-emerald{background:#059669}.b-indigo{background:#4f46e5}.b-slate{background:#334155}.b-green{background:#16a34a}
main{max-width:80rem;margin:0 auto;padding:1rem;display:grid;gap:1.5rem}
@media(min-width:768px){main{padding:1.5rem}}
.box{background:#fff;border-radius:.75rem;border:1px solid #e2e8f0;box-shadow:0 1px 2px #0001}
/* KPI */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(min-width:768px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:1rem;display:flex;align-items:center;gap:1rem}
.kpi .ic{width:3rem;height:3rem;border-radius:.5rem;display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.kpi small{font-size:.75rem;color:#94a3b8;font-weight:600;display:block}
.kpi b{font-size:1.25rem;font-weight:700}
/* controls */
.ctl{padding:1rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem}
.ctl-l{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;flex:1}
.search{position:relative;flex:1;min-width:240px}
.search .i{position:absolute;left:.75rem;top:.75rem;color:#94a3b8;font-size:.875rem}
input,select{font:inherit;font-size:.875rem;border:1px solid #cbd5e1;border-radius:.5rem;padding:.5rem .75rem;background:#fff;outline:0}
.search input{width:100%;padding-left:2.25rem}
input:focus,select:focus{box-shadow:0 0 0 2px #6366f1;border-color:transparent}
.tabs{display:flex;background:#f1f5f9;padding:.25rem;border-radius:.5rem;border:1px solid #e2e8f0}
.tab{padding:.375rem .75rem;border-radius:.375rem;font-size:.75rem;font-weight:600;color:#475569;display:inline-flex;align-items:center;gap:.25rem}
.tab.on{background:#fff;color:#4338ca;box-shadow:0 1px 2px #0002}
/* kanban */
#view-kanban{display:grid;grid-template-columns:1fr;gap:1rem;align-items:start}
@media(min-width:768px){#view-kanban{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){#view-kanban{grid-template-columns:repeat(4,1fr)}}
.col{border-radius:.75rem;padding:.75rem;border:1px solid var(--bd);background:var(--bg)}
.col-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;padding:0 .25rem}
.col-h h3{font-weight:700;color:var(--tx);font-size:.875rem;display:flex;align-items:center;gap:.5rem}
.col-h h3 i{width:.625rem;height:.625rem;border-radius:50%;background:var(--dot)}
.col-h span{font-size:.75rem;background:#fff;color:var(--tx);font-weight:700;padding:.125rem .5rem;border-radius:9999px;box-shadow:0 1px 2px #0002}
.col-b{display:grid;gap:.75rem;min-height:300px;align-content:start}
.col-b.over{outline:2px dashed #818cf8;outline-offset:2px;border-radius:.5rem}
.task{background:#fff;padding:.875rem;border-radius:.75rem;box-shadow:0 1px 2px #0002;border:1px solid #e2e8f0;display:grid;gap:.5rem;cursor:grab;transition:box-shadow .15s}
.task:hover{box-shadow:0 2px 6px #0003}
.task:active{cursor:grabbing}
.task.dragging{opacity:.4}
.task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.task-top div{display:flex;gap:.25rem}
.ib{color:#94a3b8;font-size:.75rem;padding:.125rem}
.ib.e:hover{color:#4f46e5}.ib.d:hover{color:#dc2626}
.task h4{font-weight:700;font-size:.875rem;line-height:1.35;overflow-wrap:anywhere}
.task-meta{font-size:11px;color:#64748b;display:grid;gap:.25rem;padding-top:.25rem;border-top:1px solid #f1f5f9}
.task-meta .i{color:#94a3b8;margin-right:.25rem}
.task-meta b{color:#334155}
.badge{font-size:10px;padding:.125rem .5rem;border-radius:9999px;background:#f1f5f9;color:#334155}
.p-Urgent{background:#fee2e2;color:#b91c1c;font-weight:700}
.p-High{background:#ffedd5;color:#c2410c}
.p-Medium{background:#dbeafe;color:#1d4ed8}
/* table */
#view-table{overflow:hidden}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:.875rem}
thead{background:#f8fafc;color:#475569;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
th,td{padding:.75rem}
th{border-bottom:1px solid #e2e8f0;font-weight:600}
td{border-top:1px solid #f1f5f9;color:#334155}
tbody tr:first-child td{border-top:0}
tbody tr:hover{background:#f8fafc}
td.t{font-weight:600;color:#1e293b}
td small{font-size:.75rem;color:#94a3b8}
td .badge{font-size:.75rem;padding:.25rem .625rem}
td .st{font-weight:600;font-size:.75rem;color:#4f46e5;background:#eef2ff;padding:.25rem .5rem;border-radius:.25rem}
.c{text-align:center}
.empty{padding:1.5rem;text-align:center;color:#94a3b8}
/* modal */
.modal{position:fixed;inset:0;background:#0f172a80;z-index:50;display:none;align-items:center;justify-content:center;padding:1rem}
.modal.open{display:flex}
.dlg{background:#fff;border-radius:1rem;box-shadow:0 20px 25px #0004;width:100%;max-width:32rem;overflow:hidden;border:1px solid #e2e8f0}
.dlg-h{background:#4338ca;color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
.dlg-h h3{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:.5rem}
.dlg-h button{color:#c7d2fe;font-size:1.125rem}.dlg-h button:hover{color:#fff}
.dlg form{padding:1.5rem;display:grid;gap:1rem;font-size:.875rem}
.dlg label{display:block;color:#475569;font-weight:600}
.dlg label .r{color:#ef4444}
.dlg input,.dlg select{display:block;width:100%;margin-top:.25rem;font-weight:400}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.foot{padding-top:.75rem;display:flex;justify-content:flex-end;gap:.5rem;border-top:1px solid #e2e8f0}
.foot button{padding:.5rem 1rem;border-radius:.5rem;font-weight:600}
.cancel{border:1px solid #cbd5e1;color:#475569}.cancel:hover{background:#f8fafc}
.dl{display:grid;gap:.625rem;padding:1.5rem;font-size:.875rem;max-height:70vh;overflow:auto;margin:0}
.dl div{border-bottom:1px solid #f1f5f9;padding-bottom:.5rem}
.dl dt{font-size:.75rem;font-weight:700;color:#64748b}
.dl dd{margin:0;white-space:pre-line;overflow-wrap:anywhere;color:#1e293b}
.ok{background:#4f46e5;color:#fff;box-shadow:0 1px 3px #0004}.ok:hover{background:#4338ca}
</style>
</head>

<header>
 <div class="bar">
  <div class="brand">
   <svg class="i"><use href="#i-pie"/></svg>
   <div><h1>Graphic Task Management Dashboard</h1><p>ระบบติดตามและบริหารจัดการคิวงานกราฟิกภาพรวม</p></div>
  </div>
  <div class="acts">
   <button class="cloud-pill" id="cloud-status" type="button"></button>
   <button class="btn b-indigo" data-act="refresh" title="ซิงก์ข้อมูลตอนนี้"><svg class="i"><use href="#i-sync"/></svg></button>
   <a class="nav" href="index.html">&larr; หน้าแรก</a>
   <button class="btn b-emerald" data-act="add"><svg class="i"><use href="#i-plus"/></svg> เพิ่มงานใหม่</button>
   <div class="sep"></div>
   <button class="btn b-slate" data-act="csv" title="ส่งออกไฟล์ CSV"><svg class="i"><use href="#i-file"/></svg> CSV</button>
   <button class="btn b-green" data-act="xlsx" title="ส่งออกไฟล์ Excel"><svg class="i"><use href="#i-grid"/></svg> Excel</button>
   <div class="sep"></div>
   <button class="btn b-indigo" data-act="backup" title="สำรองข้อมูลทั้งหมดเป็นไฟล์ .json (พร้อมรายละเอียดบรีฟ)"><svg class="i"><use href="#i-file"/></svg> สำรอง</button>
   <button class="btn b-indigo" data-act="import" title="นำเข้าไฟล์ .json ที่สำรองไว้ (รวมกับข้อมูลเดิม)"><svg class="i"><use href="#i-plus"/></svg> นำเข้า</button>
   <input type="file" id="importFile" accept=".json,application/json" class="hidden">
  </div>
 </div>
</header>

<main>
 <section class="kpis">
  <div class="box kpi"><div class="ic" style="background:#eef2ff;color:#4f46e5"><svg class="i"><use href="#i-layers"/></svg></div><div><small>งานทั้งหมด (Total)</small><b id="kpi-total">0</b></div></div>
  <div class="box kpi"><div class="ic" style="background:#fffbeb;color:#d97706"><svg class="i"><use href="#i-spin"/></svg></div><div><small>กำลังดำเนินการ (In Progress)</small><b id="kpi-progress" style="color:#d97706">0</b></div></div>
  <div class="box kpi"><div class="ic" style="background:#fef2f2;color:#dc2626"><svg class="i"><use href="#i-warn"/></svg></div><div><small>งานด่วนพิเศษ (Urgent)</small><b id="kpi-urgent" style="color:#dc2626">0</b></div></div>
  <div class="box kpi"><div class="ic" style="background:#ecfdf5;color:#059669"><svg class="i"><use href="#i-check"/></svg></div><div><small>เสร็จสิ้นแล้ว (Completed)</small><b id="kpi-completed" style="color:#059669">0</b></div></div>
 </section>

 <section class="box ctl">
  <div class="ctl-l">
   <div class="search"><svg class="i"><use href="#i-search"/></svg><input type="text" id="searchInput" placeholder="ค้นหาชื่องาน, ผู้ส่งบรีฟ, ผู้ดูแล..."></div>
   <select id="filterPriority">
    <option value="">ทุกระดับความสำคัญ</option><option>Normal</option><option>Medium</option><option>High / Campaign</option><option>Urgent</option>
   </select>
  </div>
  <div class="tabs">
   <button class="tab on" data-view="kanban"><svg class="i"><use href="#i-cols"/></svg> Kanban Board</button>
   <button class="tab" data-view="table"><svg class="i"><use href="#i-list"/></svg> Table View</button>
  </div>
 </section>

 <section id="view-kanban"></section>

 <section id="view-table" class="box hidden">
  <div class="tw">
   <table>
    <thead><tr>
     <th>ชื่องาน (Project Title)</th><th>ผู้ส่งบรีฟ</th><th>ความสำคัญ</th><th>สถานะ</th><th>กำหนดส่ง (Deadline)</th><th>ผู้ดูแล</th><th class="c">จัดการ</th>

 <div class="dlg">
  <div class="dlg-h">
   <h3 id="modalTitle"></h3>

    <label>ผู้ส่งบรีฟ (Requester)<input type="text" id="formRequester"></label>

 <div class="dlg">
  <div class="dlg-h"><h3 id="briefTitle"></h3><button type="button" data-act="close" aria-label="ปิด"><svg class="i"><use href="#i-x"/></svg></button></div>
  <dl class="dl" id="briefBody"></dl>
 </div>

<script src="cloud.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'graphic_tasks_db';
const ic = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const STATUSES = [
 { key:'Pending Brief', bg:'#e2e8f0b3', bd:'#cbd5e1', tx:'#334155', dot:'#94a3b8' },
 { key:'In Queue',      bg:'#eff6ffb3', bd:'#bfdbfe', tx:'#1d4ed8', dot:'#3b82f6' },
 { key:'In Progress',   bg:'#fffbebb3', bd:'#fde68a', tx:'#b45309', dot:'#f59e0b' },
 { key:'Completed',     bg:'#ecfdf5b3', bd:'#a7f3d0', tx:'#047857', dot:'#10b981' }
];

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
let tasks = load();
const save = () => localStorage.setItem(KEY, JSON.stringify(tasks));   // แคชในเครื่อง

// ----- ซิงก์กับ Google Sheets (ถ้าเชื่อมต่อไว้) -----
let dragId = null;
async function cloudSync() {
 if (!Cloud.configured()) return;
 const before = tasks;
 const list = await Cloud.sync();
 if (!list) return;                                   // ล้มเหลว: คงข้อมูลในเครื่องไว้ ระบบจะลองใหม่เอง
 const next = Cloud.overlay(list);
 if (JSON.stringify(next) !== JSON.stringify(tasks)) { tasks = next; save(); render(); }
 await seedLocal(before, list);
}
// ครั้งแรกที่เชื่อมต่อ: ถ้ามีงานในเครื่องที่ยังไม่อยู่ใน Sheets ให้เลือกว่าจะอัปโหลดหรือไม่
async function seedLocal(before, list) {
 const url = Cloud.config().url;
 if (localStorage.getItem('gfx_seed') === url) return;
 localStorage.setItem('gfx_seed', url);
 const known = new Set(list.map(t => t.id));
 const only = before.filter(t => !known.has(t.id));
 if (!only.length) return;
 if (!confirm(`พบ ${only.length} งานในเครื่องนี้ที่ยังไม่อยู่ใน Google Sheets\nอัปโหลดขึ้น Sheets ด้วยหรือไม่?\n\nถ้ากดยกเลิก งานเหล่านี้จะหายจากหน้านี้ (กดปุ่ม "สำรอง" เก็บไว้ก่อนได้)`)) return;
 only.forEach(t => Cloud.enqueue({ type: 'upsert', task: t }));
 const l2 = await Cloud.sync();
 if (l2) { tasks = Cloud.overlay(l2); save(); render(); }
}
// บันทึกการเปลี่ยนแปลง: แคชในเครื่อง + (ถ้าเชื่อมต่อ) ส่งขึ้น Sheets
function persist(...ops) {
 save();
 if (Cloud.configured()) { ops.forEach(o => Cloud.enqueue(o)); cloudSync(); }
}

// สร้างคอลัมน์ Kanban จาก config (ไม่ต้องเขียน HTML ซ้ำ 4 ชุด)
const board = $('view-kanban');
board.innerHTML = STATUSES.map((s, i) => `
 <div class="col" style="--bg:${s.bg};--bd:${s.bd};--tx:${s.tx};--dot:${s.dot}">
  <div class="col-h"><h3><i></i>${s.key}</h3><span id="cnt-${i}">0</span></div>
  <div class="col-b" id="col-${i}" data-status="${s.key}"></div>
 </div>`).join('');
const colEls = STATUSES.map((_, i) => $('col-' + i));
const cntEls = STATUSES.map((_, i) => $('cnt-' + i));

const p2 = n => String(n).padStart(2,'0');
const fmtDate = s => {
 if (!s) return '-';
 const d = new Date(s);
 return isNaN(d) ? '-' : `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
};
const pClass = p => p === 'Urgent' ? 'p-Urgent' : p === 'High / Campaign' ? 'p-High' : p === 'Medium' ? 'p-Medium' : '';

function render() {
 const q = $('searchInput').value.toLowerCase();
 const fp = $('filterPriority').value;
 const groups = STATUSES.map(() => []);
 const rows = [];
 let progress = 0, urgent = 0, done = 0;

 for (const t of tasks) {
  if (t.status === 'In Progress') progress++;
  else if (t.status === 'Completed') done++;
  if (t.priority === 'Urgent') urgent++;

  if (fp && t.priority !== fp) continue;
  if (q && !((t.title || '').toLowerCase().includes(q) || (t.requester || '').toLowerCase().includes(q) || (t.assignee || '').toLowerCase().includes(q))) continue;

  const id = esc(t.id), title = esc(t.title), req = esc(t.requester || '-'), asg = esc(t.assignee || '-');
  const pb = `badge ${pClass(t.priority)}`, date = fmtDate(t.deadline);
  const eye = t.brief ? `<button class="ib e" data-act="view" data-id="${id}" aria-label="ดูบรีฟ">${ic('eye')}</button>` : '';

  const gi = STATUSES.findIndex(s => s.key === t.status);
  if (gi >= 0) groups[gi].push(`
   <div class="task" draggable="true" data-id="${id}">
    <div class="task-top">
     <span class="${pb}">${esc(t.priority)}</span>
     <div>${eye}<button class="ib e" data-act="edit" data-id="${id}" aria-label="แก้ไข">${ic('pen')}</button><button class="ib d" data-act="del" data-id="${id}" aria-label="ลบ">${ic('trash')}</button></div>
    </div>
    <h4>${title}</h4>
    <div class="task-meta">
     <div>${ic('user')}${req} (${esc(t.dept || 'ทั่วไป')})</div>
     <div>${ic('clock')}${date}</div>
     <div>ผู้ดูแล: <b>${asg}</b></div>
    </div>
   </div>`);

  rows.push(`
   <tr>
    <td class="t">${title}</td>
    <td>${req} <small>(${esc(t.dept || '-')})</small></td>
    <td><span class="${pb}">${esc(t.priority)}</span></td>
    <td><span class="st">${esc(t.status)}</span></td>
    <td>${date}</td>
    <td>${asg}</td>
    <td class="c">${eye} <button class="ib e" data-act="edit" data-id="${id}" aria-label="แก้ไข">${ic('pen')}</button> <button class="ib d" data-act="del" data-id="${id}" aria-label="ลบ">${ic('trash')}</button></td>
   </tr>`);
 }

 groups.forEach((g, i) => { colEls[i].innerHTML = g.join(''); cntEls[i].textContent = g.length; });
 $('table-body').innerHTML = rows.join('') || '<tr><td colspan="7" class="empty">ไม่พบข้อมูลงานกราฟิก</td></tr>';
 $('kpi-total').textContent = tasks.length;
 $('kpi-progress').textContent = progress;
 $('kpi-urgent').textContent = urgent;
 $('kpi-completed').textContent = done;
}

// ----- view switch -----
function switchView(v) {
 const k = v === 'kanban';
 $('view-kanban').classList.toggle('hidden', !k);
 $('view-table').classList.toggle('hidden', k);
 document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.view === v));
}

// ----- modal -----
const modal = $('taskModal');
const closeModal = () => document.querySelectorAll('.modal.open').forEach(m => m.classList.remove('open'));
function openModal(task) {
 $('taskForm').reset();
 $('taskId').value = task ? task.id : '';
 if (task) {
  $('formTitle').value = task.title;
  $('formRequester').value = task.requester || '';
  $('formDept').value = task.dept || '';
  $('formPriority').value = task.priority;
  $('formStatus').value = task.status;
  $('formDeadline').value = task.deadline || '';
  $('formAssignee').value = task.assignee || '';
 }
 $('modalTitle').innerHTML = task ? ic('pen') + ' แก้ไขข้อมูลงาน' : ic('plus') + ' เพิ่มงานใหม่';
 modal.classList.add('open');
 $('formTitle').focus();
}

$('taskForm').addEventListener('submit', e => {
 e.preventDefault();
 const id = $('taskId').value;
 const t = {
  id: id || Date.now().toString(),
  title: $('formTitle').value,
  requester: $('formRequester').value,
  dept: $('formDept').value,
  priority: $('formPriority').value,
  status: $('formStatus').value,
  deadline: $('formDeadline').value,
  assignee: $('formAssignee').value
 };
 const i = tasks.findIndex(x => x.id === id);
 if (i >= 0 && tasks[i].brief) t.brief = tasks[i].brief;
 i >= 0 ? (tasks[i] = t) : tasks.push(t);
 closeModal(); render();
 persist({ type: 'upsert', task: t });
});

// ----- export -----
const download = (blob, name) => {
 const a = document.createElement('a');
 a.href = URL.createObjectURL(blob); a.download = name; a.click();
 setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;

function exportCSV() {
 const lines = ['Task Title,Requester,Department,Priority,Status,Deadline,Assignee'];
 for (const t of tasks) lines.push([t.title, t.requester, t.dept, t.priority, t.status, t.deadline, t.assignee].map(q).join(','));
 download(new Blob(['\uFEFF' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8;' }), 'Graphic_Tasks_Summary.csv');
}

let xlsxP;
const loadXLSX = () => window.XLSX ? Promise.resolve() : (xlsxP ||= new Promise((ok, fail) => {
 const s = document.createElement('script');
 s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
 s.onload = ok;
 s.onerror = () => { xlsxP = null; fail(new Error('โหลดไลบรารี Excel ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่')); };
 document.head.appendChild(s);
}));

async function exportExcel() {
 try { await loadXLSX(); } catch (e) { return alert(e.message); }
 const data = tasks.map(t => ({
  'ชื่องาน (Project Title)': t.title, 'ผู้ส่งบรีฟ (Requester)': t.requester, 'แผนก (Department)': t.dept,
  'ความสำคัญ (Priority)': t.priority, 'สถานะ (Status)': t.status, 'กำหนดส่ง (Deadline)': t.deadline, 'ผู้ดูแล (Assignee)': t.assignee
 }));
 const ws = XLSX.utils.json_to_sheet(data);
 ws['!cols'] = [35, 20, 15, 18, 18, 20, 15].map(wch => ({ wch }));
 const wb = XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb, ws, 'Graphic Tasks');
 XLSX.writeFile(wb, 'Graphic_Tasks_Summary.xlsx');
}

// ----- brief detail -----
const BRIEF_LABELS = [
 ['objective','วัตถุประสงค์ (Objective)'], ['target','กลุ่มเป้าหมาย (Target)'], ['headline','Headline'],
 ['subHeadline','Sub-headline / Body'], ['cta','Call To Action'], ['dimensions','ขนาด (Dimensions)'],
 ['fileType','ประเภทไฟล์ (Format)'], ['reference','Mood & Tone / Reference']
];
function showBrief(t) {
 if (!t || !t.brief) return;
 $('briefTitle').textContent = t.title;
 $('briefBody').innerHTML = BRIEF_LABELS.map(([k, l]) => `<div><dt>${l}</dt><dd>${esc(t.brief[k]) || '-'}</dd></div>`).join('');
 $('briefModal').classList.add('open');
}

// ----- backup / import (ใช้ย้ายข้อมูลข้ามเครื่องเมื่อโฮสต์บน GitHub Pages) -----
const PRIORITIES = ['Normal', 'Medium', 'High / Campaign', 'Urgent'];
const str = v => typeof v === 'string' ? v : '';
function clean(t) {
 if (!t || typeof t !== 'object' || !str(t.title).trim()) return null;
 const o = {
  id: str(t.id) || Date.now().toString() + Math.random().toString(36).slice(2, 6),
  title: str(t.title), requester: str(t.requester), dept: str(t.dept),
  priority: PRIORITIES.includes(t.priority) ? t.priority : 'Normal',
  status: STATUSES.some(s => s.key === t.status) ? t.status : 'Pending Brief',
  deadline: str(t.deadline), assignee: str(t.assignee)
 };
 if (t.brief && typeof t.brief === 'object') o.brief = Object.fromEntries(BRIEF_LABELS.map(([k]) => [k, str(t.brief[k])]));
 return o;
}
function backup() {
 const d = new Date();
 download(new Blob([JSON.stringify({ app: 'graphic-tasks', version: 1, exported: d.toISOString(), tasks }, null, 1)], { type: 'application/json' }),
  `Graphic_Tasks_Backup_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}.json`);
}
$('importFile').addEventListener('change', async e => {
 const f = e.target.files[0]; e.target.value = '';
 if (!f) return;
 try {
  const j = JSON.parse(await f.text());
  const list = (Array.isArray(j) ? j : j.tasks);
  if (!Array.isArray(list)) throw 0;
  const incoming = list.map(clean).filter(Boolean);
  if (!incoming.length) return alert('ไม่พบข้อมูลงานในไฟล์นี้');
  const known = new Set(tasks.map(t => t.id));
  const upd = incoming.filter(t => known.has(t.id)).length;
  if (!confirm(`นำเข้า ${incoming.length} งาน (เพิ่มใหม่ ${incoming.length - upd}, อัปเดตงานเดิม ${upd})\nดำเนินการต่อหรือไม่?`)) return;
  const map = new Map(tasks.map(t => [t.id, t]));
  incoming.forEach(t => map.set(t.id, t));
  tasks = [...map.values()]; render();
  persist(...incoming.map(task => ({ type: 'upsert', task })));
 } catch { alert('ไฟล์ไม่ถูกต้อง กรุณาเลือกไฟล์ .json ที่สำรองจากระบบนี้'); }
});

// ----- events (delegation) -----
document.addEventListener('click', e => {
 const b = e.target.closest('[data-act],[data-view]');
 if (b) {
  if (b.dataset.view) return switchView(b.dataset.view);
  const id = b.dataset.id;
  switch (b.dataset.act) {
   case 'add': return openModal();
   case 'close': return closeModal();
   case 'csv': return exportCSV();
   case 'xlsx': return exportExcel();
   case 'refresh': return Cloud.configured() ? cloudSync() : Cloud.openSettings();
   case 'backup': return backup();
   case 'import': return $('importFile').click();
   case 'view': return showBrief(tasks.find(t => t.id === id));
   case 'edit': return openModal(tasks.find(t => t.id === id));
   case 'del':
    if (confirm('คุณต้องการลบงานนี้ใช่หรือไม่?')) { tasks = tasks.filter(t => t.id !== id); render(); persist({ type: 'delete', id }); }
    return;
  }
 }
 if (e.target.classList.contains('modal')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// drag & drop
board.addEventListener('dragstart', e => {
 const c = e.target.closest('.task'); if (!c) return;
 dragId = c.dataset.id; e.dataTransfer.setData('text', dragId); e.dataTransfer.effectAllowed = 'move';
 requestAnimationFrame(() => c.classList.add('dragging'));
});
board.addEventListener('dragend', () => {
 dragId = null;
 board.querySelectorAll('.dragging,.over').forEach(n => n.classList.remove('dragging', 'over'));
});
board.addEventListener('dragover', e => {
 const col = e.target.closest('.col-b'); if (!col) return;
 e.preventDefault();
 board.querySelectorAll('.over').forEach(n => n !== col && n.classList.remove('over'));
 col.classList.add('over');
});
board.addEventListener('drop', e => {
 const col = e.target.closest('.col-b'); if (!col) return;
 e.preventDefault();
 const t = tasks.find(x => x.id === (e.dataTransfer.getData('text') || dragId));
 if (t && t.status !== col.dataset.status) { t.status = col.dataset.status; render(); persist({ type: 'upsert', task: t }); return; }
 render();
});

// ค้นหา (debounce) + ตัวกรอง
let timer;
$('searchInput').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 120); });
$('filterPriority').addEventListener('change', render);

// ซิงก์อัตโนมัติเมื่อ BriefGen (หรือแท็บอื่น) ส่งงานเข้ามา
window.addEventListener('storage', e => { if (e.key === KEY) { tasks = load(); render(); } });

// โหลด SheetJS ล่วงหน้าเมื่อเมาส์แตะปุ่ม Excel
document.querySelector('[data-act="xlsx"]').addEventListener('pointerenter', () => loadXLSX().catch(() => {}), { once: true });

// ดึงข้อมูลล่าสุดจาก Sheets ทุก 30 วินาที (เฉพาะตอนเปิดหน้านี้อยู่ และไม่ได้กำลังลากการ์ด)
setInterval(() => { if (!document.hidden && dragId === null && !document.querySelector('.modal.open')) cloudSync(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) cloudSync(); });
Cloud.onConfigChange(cloudSync);

render();
cloudSync();
})();
</script>
</body>
</html>
